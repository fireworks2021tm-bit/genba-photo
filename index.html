<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ポモドーロ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポモドーロ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DCE3E8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --paper:#DCE3E8;
  --grid:#C7D2DA;
  --grid-bold:#B4C3CD;
  --ink:#1A2730;
  --ink-soft:#5D707C;
  --hair:#9DAEB9;
  --work:#B03A2E;
  --brk:#2E6B8C;
  --accent:var(--work);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";
  display:flex;flex-direction:column;
  min-height:100svh;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
  touch-action:manipulation;
  overscroll-behavior:none;
  /* 方眼紙 */
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-bold) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-bold) 1px,transparent 1px);
  background-size:10mm 10mm,10mm 10mm,50mm 50mm,50mm 50mm;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* --- 図面枠 --- */
.sheet{
  flex:1;display:flex;flex-direction:column;
  border:1px solid var(--hair);
  outline:3px double transparent;
  background:rgba(238,242,245,.72);
  backdrop-filter:blur(1px);
  position:relative;
}
.sheet::before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(157,174,185,.5);pointer-events:none;
}

/* --- 表題欄（上） --- */
.titleblock{
  display:flex;align-items:baseline;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--hair);
}
.phase{
  font-size:15px;font-weight:700;letter-spacing:.28em;
  color:var(--accent);
}
.sets{margin-left:auto;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border:1.5px solid var(--ink-soft);border-radius:50%}
.dot.on{background:var(--accent);border-color:var(--accent)}
.setlabel{font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}

/* --- 中央：寸法として読む残り時間 --- */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px 14px;
}
.time{
  font-size:clamp(3.6rem,21vw,6.4rem);
  font-weight:600;line-height:.92;letter-spacing:-.02em;
  color:var(--ink);
}
.dimwrap{width:100%;max-width:420px}
svg{display:block;width:100%;height:34px;overflow:visible}
.dimline{stroke:var(--accent);stroke-width:1.6}
.extline{stroke:var(--accent);stroke-width:1.2}
.track{stroke:var(--hair);stroke-width:1;stroke-dasharray:2 3}
.arrow{fill:var(--accent)}
.endlabel{
  display:flex;justify-content:space-between;width:100%;max-width:420px;
  font-size:11px;letter-spacing:.1em;color:var(--ink-soft);
}
.overrun{
  font-size:12px;letter-spacing:.08em;color:var(--work);min-height:16px;
}

/* --- 操作 --- */
.controls{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:9px}
button{
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.1em;
  color:var(--ink);background:transparent;
  border:1px solid var(--ink);border-radius:0;
  padding:14px 10px;cursor:pointer;flex:1;
  transition:background .12s,color .12s;
}
button:active{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#start{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:17px;padding:17px 10px}
#start:active{opacity:.75}
.ghost{border-color:var(--hair);color:var(--ink-soft);font-weight:500;font-size:13px;padding:11px 10px}

/* --- 設定（表題欄・下） --- */
details{border-top:1px solid var(--hair)}
summary{
  list-style:none;padding:11px 14px;font-size:12px;letter-spacing:.16em;
  color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:8px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-left:auto;font-size:11px}
details[open] summary::after{content:"▴"}
.fields{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}
input[type=number]{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;
  border:none;border-bottom:1px solid var(--hair);background:transparent;
  color:var(--ink);padding:5px 2px;width:100%;border-radius:0;
}
input[type=number]:focus{outline:none;border-bottom-color:var(--accent)}
.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:9px;font-size:13px;letter-spacing:.06em;color:var(--ink)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--work)}
.note{grid-column:1/-1;font-size:11px;line-height:1.6;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet">

  <div class="titleblock">
    <span class="phase mono" id="phaseLabel">作業</span>
    <span class="sets">
      <span class="setlabel mono" id="setLabel">SET 1</span>
      <span class="dot" data-i="0"></span><span class="dot" data-i="1"></span>
      <span class="dot" data-i="2"></span><span class="dot" data-i="3"></span>
    </span>
  </div>

  <div class="stage">
    <div class="time mono" id="time">25:00</div>
    <div class="dimwrap">
      <svg viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true">
        <line class="track" x1="4" y1="17" x2="396" y2="17"/>
        <line class="extline" x1="4" y1="4" x2="4" y2="30"/>
        <line class="extline" id="extR" x1="396" y1="4" x2="396" y2="30"/>
        <line class="dimline" id="dim" x1="4" y1="17" x2="396" y2="17"/>
        <polygon class="arrow" points="4,17 13,13.5 13,20.5"/>
        <polygon class="arrow" id="arrowR" points="396,17 387,13.5 387,20.5"/>
      </svg>
    </div>
    <div class="endlabel mono"><span id="startedAt">--:--</span><span id="endsAt">--:--</span></div>
    <div class="overrun mono" id="overrun"></div>
  </div>

  <div class="controls">
    <div class="row"><button id="start">開始</button></div>
    <div class="row">
      <button class="ghost" id="reset">リセット</button>
      <button class="ghost" id="skip">次へ進む</button>
    </div>
  </div>

  <details>
    <summary>設定</summary>
    <div class="fields">
      <label>作業（分）<input type="number" id="fWork" min="1" max="180" step="1" value="25" inputmode="numeric"></label>
      <label>短い休憩（分）<input type="number" id="fShort" min="1" max="60" step="1" value="5" inputmode="numeric"></label>
      <label>長い休憩（分）<input type="number" id="fLong" min="1" max="120" step="1" value="15" inputmode="numeric"></label>
      <label>長休憩までのセット<input type="number" id="fCycle" min="2" max="8" step="1" value="4" inputmode="numeric"></label>
      <label class="chk"><input type="checkbox" id="fAuto"> 次の区切りを自動で開始する</label>
      <label class="chk"><input type="checkbox" id="fSound" checked> 区切りで音を鳴らす</label>
      <p class="note">画面を消すと通知音は鳴りません。点けたまま置いておくと、作業中は自動で画面が保持されます（対応端末のみ）。画面を消しても残り時間の計算はずれません。</p>
    </div>
  </details>

</div>

<script>
(function(){
  "use strict";

  /* ---------- 設定の保存（使えない環境ではメモリのみ） ---------- */
  var store = (function(){
    try{ var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage; }
    catch(e){ var m={}; return {getItem:function(k){return k in m?m[k]:null;},setItem:function(k,v){m[k]=String(v);}}; }
  })();

  var cfg = {work:25, short:5, long:15, cycle:4, auto:false, sound:true};
  try{ var saved = JSON.parse(store.getItem("pomodoro.cfg")||"{}");
       for(var k in cfg){ if(k in saved) cfg[k]=saved[k]; } }catch(e){}

  var el = function(id){ return document.getElementById(id); };
  var $time=el("time"), $phase=el("phaseLabel"), $set=el("setLabel"),
      $dim=el("dim"), $extR=el("extR"), $arrowR=el("arrowR"),
      $start=el("start"), $overrun=el("overrun"),
      $startedAt=el("startedAt"), $endsAt=el("endsAt"),
      dots=document.querySelectorAll(".dot");

  /* ---------- 状態 ---------- */
  var phase="work";        // work | short | long
  var setNo=1;             // 現在が何セット目の作業か
  var running=false;
  var endAt=0;             // 終了予定の絶対時刻(ms)
  var remain=0;            // 停止中の残り(ms)
  var startedTs=0;

  function phaseMin(){ return phase==="work"?cfg.work : phase==="short"?cfg.short : cfg.long; }
  function phaseMs(){ return phaseMin()*60000; }
  function phaseName(){ return phase==="work"?"作業" : phase==="short"?"休憩" : "長い休憩"; }

  /* ---------- 音（Web Audio：外部ファイル不要） ---------- */
  var ac=null;
  function primeAudio(){
    try{
      if(!ac){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; ac=new C(); }
      if(ac.state==="suspended") ac.resume();
      // 無音を1回鳴らして iOS の自動再生制限を解除する
      var b=ac.createBuffer(1,1,22050), s=ac.createBufferSource();
      s.buffer=b; s.connect(ac.destination); s.start(0);
    }catch(e){}
  }
  function chime(up){
    if(!cfg.sound||!ac) return;
    try{
      var t=ac.currentTime, notes = up?[660,880,1174]:[880,660,494];
      notes.forEach(function(f,i){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type="triangle"; o.frequency.value=f;
        var s=t+i*0.16;
        g.gain.setValueAtTime(0,s);
        g.gain.linearRampToValueAtTime(0.28,s+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.42);
        o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s+0.45);
      });
    }catch(e){}
  }

  /* ---------- 画面の保持 ---------- */
  var lock=null;
  function keepAwake(on){
    try{
      if(on && running && "wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(l){ lock=l; }).catch(function(){});
      } else if(!on && lock){ lock.release().catch(function(){}); lock=null; }
    }catch(e){}
  }

  /* ---------- 表示 ---------- */
  function fmt(ms){
    if(ms<0) ms=0;
    var s=Math.round(ms/1000);
    return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }
  function clock(ts){
    var d=new Date(ts);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function paint(){
    var left = running ? endAt-Date.now() : remain;
    if(left<0) left=0;
    $time.textContent = fmt(left);

    var frac = phaseMs()>0 ? Math.max(0,Math.min(1,left/phaseMs())) : 0;
    var x = 4 + (392*frac);
    $dim.setAttribute("x2",x); $extR.setAttribute("x1",x); $extR.setAttribute("x2",x);
    $arrowR.setAttribute("points", x+",17 "+(x-9)+",13.5 "+(x-9)+",20.5");

    document.documentElement.style.setProperty("--accent", phase==="work"?"var(--work)":"var(--brk)");
    $phase.textContent = phaseName();
    $set.textContent = "SET "+setNo;
    for(var i=0;i<dots.length;i++){
      dots[i].style.display = i<cfg.cycle ? "" : "none";
      dots[i].classList.toggle("on", i < (phase==="work"? setNo-1 : setNo));
    }
    $start.textContent = running ? "一時停止" : (remain===phaseMs() ? "開始" : "再開");
    $startedAt.textContent = running||startedTs ? clock(startedTs) : "--:--";
    $endsAt.textContent = running ? clock(endAt) : "--:--";
    document.title = (running? fmt(left)+" " : "")+phaseName()+" | ポモドーロ";
  }

  /* ---------- 進行 ---------- */
  function loadPhase(){ remain=phaseMs(); endAt=0; startedTs=0; $overrun.textContent=""; paint(); }

  function nextPhase(){
    if(phase==="work"){
      phase = (setNo % cfg.cycle === 0) ? "long" : "short";
    }else{
      if(phase==="long") setNo=1; else setNo++;
      phase="work";
    }
    loadPhase();
  }

  function finish(){
    running=false; keepAwake(false);
    var lateMs = Date.now()-endAt;
    chime(phase!=="work");           // 作業終了＝下がる音 / 休憩終了＝上がる音
    var wasWork = phase==="work";
    nextPhase();
    if(lateMs>60000){
      $overrun.textContent = "画面を離れていた間に終了（"+fmt(lateMs)+" 経過）";
    }else{
      $overrun.textContent = wasWork ? "作業おわり。休憩へ" : "休憩おわり。作業へ";
    }
    if(cfg.auto && lateMs<=60000){ begin(); } else { paint(); }
  }

  function begin(){
    primeAudio();
    if(remain<=0) remain=phaseMs();
    endAt = Date.now()+remain;
    startedTs = Date.now();
    running = true;
    $overrun.textContent="";
    keepAwake(true);
    paint();
  }
  function pause(){
    remain = Math.max(0, endAt-Date.now());
    running=false; keepAwake(false); paint();
  }

  /* 200ms ごとに「終了予定時刻 − 現在時刻」を引き直す。
     刻みを数えないので、裏に回っても復帰時にずれない。 */
  setInterval(function(){
    if(!running) return;
    if(Date.now()>=endAt){ finish(); } else { paint(); }
  },200);

  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible") return;
    if(running){
      keepAwake(true);
      if(Date.now()>=endAt) finish(); else paint();
    }
  });

  /* ---------- 操作 ---------- */
  $start.addEventListener("click",function(){ running?pause():begin(); });
  el("reset").addEventListener("click",function(){
    primeAudio(); running=false; keepAwake(false); phase="work"; setNo=1; loadPhase();
  });
  el("skip").addEventListener("click",function(){
    primeAudio(); running=false; keepAwake(false); nextPhase();
  });

  /* ---------- 設定 ---------- */
  var fields={work:"fWork",short:"fShort",long:"fLong",cycle:"fCycle"};
  function saveCfg(){ try{ store.setItem("pomodoro.cfg",JSON.stringify(cfg)); }catch(e){} }
  Object.keys(fields).forEach(function(key){
    var input=el(fields[key]);
    input.value=cfg[key];
    input.addEventListener("change",function(){
      var v=parseInt(input.value,10);
      if(isNaN(v)||v<1){ v=cfg[key]; }
      cfg[key]=v; input.value=v; saveCfg();
      if(!running) loadPhase(); else paint();
    });
  });
  el("fAuto").checked=cfg.auto;
  el("fAuto").addEventListener("change",function(){ cfg.auto=this.checked; saveCfg(); });
  el("fSound").checked=cfg.sound;
  el("fSound").addEventListener("change",function(){ cfg.sound=this.checked; saveCfg(); if(this.checked) primeAudio(); });

  loadPhase();
})();
</script>
</body>
</html>
